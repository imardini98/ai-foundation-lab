[project]
name = "fake-erp"
version = "0.1.0"
description = "Fake ERP REST API (Proalpha-like) for MCP experiments"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "tzdata>=2026.6",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
